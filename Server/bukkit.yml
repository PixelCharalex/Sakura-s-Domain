settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: Server closed
  minimum-api: none
  use-map-color-cache: true
spawn-limits:
  monsters: 30
  animals: 15
  water-animals: 15
  water-ambient: 10
  water-underground-creature: 10
  axolotls: 15
  ambient: 10
chunk-gc:
  period-in-ticks: 800
ticks-per:
  animal-spawns: 900
  monster-spawns: 2000
  water-spawns: 900
  water-ambient-spawns: 1200
  water-underground-creature-spawns: 600
  axolotl-spawns: 600
  ambient-spawns: 1000
  autosave: 7000
aliases: now-in-commands.yml
